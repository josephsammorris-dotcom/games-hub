<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games</title>
<meta name="description" content="A collection of browser games.">
<style>
  :root {
    --bg: #14110f;
    --surface: #1f1b18;
    --surface-hi: #2a2521;
    --text: #f4ede4;
    --muted: #a69b8e;
    --accent: #ffb23e;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f0e7;
      --surface: #fffaf2;
      --surface-hi: #fff;
      --text: #231d17;
      --muted: #7a6e60;
      --accent: #c2570c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif;
    line-height: 1.4;
  }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 4px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 28px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  a.game {
    display: flex; align-items: center; gap: 16px;
    background: var(--surface); border-radius: 12px; padding: 16px 18px;
    text-decoration: none; color: inherit;
    transition: background .15s ease, transform .15s ease;
  }
  a.game:hover, a.game:focus-visible { background: var(--surface-hi); transform: translateX(4px); outline: none; }
  a.game:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  .info { flex: 1; min-width: 0; }
  .title { font-weight: 700; font-size: 1.15rem; margin: 0; }
  .desc { color: var(--muted); font-size: .92rem; margin: 2px 0 0; }
  .play { color: var(--accent); font-weight: 700; white-space: nowrap; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>My <span>Games</span></h1>
  <p class="sub" id="count">Loading…</p>
  <ul id="list"></ul>
</main>

<script>
(async () => {
  const list = document.getElementById('list');
  const count = document.getElementById('count');
  let games;
  try {
    games = await (await fetch('games.json', { cache: 'no-cache' })).json();
  } catch (e) {
    count.textContent = 'Could not load games.';
    return;
  }
  count.textContent = games.length + (games.length === 1 ? ' game' : ' games');
  if (!games.length) { count.textContent = 'No games yet.'; return; }

  for (const g of games) {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.className = 'game';
    a.href = g.url;

    const info = document.createElement('div');
    info.className = 'info';
    const t = document.createElement('p');
    t.className = 'title';
    t.textContent = g.title;
    info.append(t);
    if (g.description) {
      const d = document.createElement('p');
      d.className = 'desc';
      d.textContent = g.description;
      info.append(d);
    }

    const play = document.createElement('span');
    play.className = 'play';
    play.textContent = 'Play →';

    a.append(info, play);
    li.append(a);
    list.append(li);
  }
})();
</script>
</body>
</html>
